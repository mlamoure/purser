[project]
name = "purser"
version = "2026.10.2"
description = "The finance backend for the personal agent stack"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "structlog>=24.1",
    "cryptography>=42",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastmcp>=4.1.2,<5",
    "mcp>=2,<3",
    "joserfc>=1.7.7,<2",
]

[project.scripts]
purser = "purser.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.5",
    "types-python-dateutil",
    "python-multipart>=0.0.32",
    "types-jsonschema>=4.26.0.20260518",
]
e2e = [
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["purser"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "purser/_migrations/migrations"
"alembic.ini" = "purser/_migrations/alembic.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "purser.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

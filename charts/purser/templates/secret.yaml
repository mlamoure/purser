{{- include "purser.validate" . }}
{{- if .Values.existingSecret }}
{{- /* At install/upgrade time (not under `helm template`), check the named
       Secret carries the keys every role refuses to start without. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.existingSecret }}
{{- if $existing }}
{{- range $key := list "PURSER_ENCRYPTION_KEY" "PURSER_DATABASE_URL" }}
{{- if not (hasKey ($existing.data | default dict) $key) }}
{{- fail (printf "existingSecret %q has no %s key" $.Values.existingSecret $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purser.fullname" . }}-secrets
  labels: {{- include "purser.labels" . | nindent 4 }}
type: Opaque
stringData:
  PURSER_DATABASE_URL: {{ include "purser.databaseUrl" . | quote }}
  PURSER_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- range $k, $v := (.Values.secrets.extra | default dict) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

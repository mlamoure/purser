# Reviewed 2026-11-16. Debian has no fixed version for these exact packages.
# Re-review reachability on code/image changes; never extend dates automatically.
# Raw scan artifacts retain all findings. New versions and new IDs fail closed.
vulnerabilities:
  - id: CVE-2026-124709
    expired_at: 2026-12-01
    statement: >-
      Reviewed 2026-11-21. OpenSSL's QUIC stack is reachable only through its QUIC API. Purser serves HTTP/1.1 over TCP (uvicorn), its clients use TLS over TCP (httpx), the image has no web server binary and no QUIC or HTTP/3 library, and Python's ssl module exposes no QUIC. Debian's 3.5.9-1~deb13u1 still carries it.
    purls:
      - pkg:deb/debian/libssl3t64@3.5.7-1~deb13u3
      - pkg:deb/debian/openssl@3.5.7-1~deb13u3
      - pkg:deb/debian/openssl-provider-legacy@3.5.7-1~deb13u3
      - pkg:deb/debian/libssl3t64@3.5.9-1~deb13u1
      - pkg:deb/debian/openssl@3.5.9-1~deb13u1
      - pkg:deb/debian/openssl-provider-legacy@3.5.9-1~deb13u1
  - id: CVE-2025-69720
    expired_at: 2026-12-01
    statement: >-
      Purser serves HTTP and runs a background worker; it does not use curses or parse untrusted terminal definitions.
    purls:
      - pkg:deb/debian/libncursesw6@6.5%2B20250216-2
      - pkg:deb/debian/libtinfo6@6.5%2B20250216-2
      - pkg:deb/debian/ncurses-base@6.5%2B20250216-2
      - pkg:deb/debian/ncurses-bin@6.5%2B20250216-2

  - id: CVE-2026-16742
    expired_at: 2026-12-01
    statement: >-
      systemd-homed is absent from the runtime image; Purser is the entrypoint, with no systemd service manager.
    purls:
      - pkg:deb/debian/libsystemd0@257.13-1~deb13u1
      - pkg:deb/debian/libudev1@257.13-1~deb13u1
  - id: CVE-2026-54369
    expired_at: 2026-12-01
    statement: >-
      No ACL manipulation or untrusted filesystem extraction in Purser. The application runs as UID 999, without privileged mounts; Compose and Helm disable privilege escalation.
    purls:
      - pkg:deb/debian/libacl1@2.3.2-2%2Bb1
  - id: CVE-2026-76642
    expired_at: 2026-12-01
    statement: >-

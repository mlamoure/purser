# Docker Compose: `docker compose up -d` brings up Purser + Postgres.
# Migrations run automatically on startup.
#
# This file is all an installation needs: download it from the release tag
# (https://raw.githubusercontent.com/mlamoure/purser/v2026.10.3/docker-compose.yml)
# into an empty directory. Compose pulls the published multi-arch image below
# (linux/amd64 + linux/arm64) the first time it is missing locally; nothing is
# built. In a clone of the repository, `docker compose build` builds the image
# from source instead and tags it with the same name, which then takes the
# place of the published one until `docker compose pull purser` fetches it again.

services:
  purser:
    # Kept equal to "v" + pyproject.toml's version (tests/test_compose.py).
    image: ghcr.io/mlamoure/purser:v2026.10.3
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PURSER_DATABASE_URL: postgresql+psycopg://purser:${POSTGRES_PASSWORD:-purser}@postgres:5432/purser
      # REQUIRED. Generate once with `purser keygen`, record it somewhere
      # safe, and export it (or put it in .env — see .env.example). Compose
      # refuses to start without it.
      PURSER_ENCRYPTION_KEY: ${PURSER_ENCRYPTION_KEY:?generate with 'purser keygen' and record it — see https://mlamoure.github.io/purser/tutorials/ai-setup/}
      PURSER_PUBLIC_URL: ${PURSER_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "${PURSER_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: purser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purser}
      POSTGRES_DB: purser
    volumes:
      - purser-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purser -d purser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  purser-pgdata:

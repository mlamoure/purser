# Docker qualification and release.
#
# qualify  - every pull request, manual run and v* tag: the backend and
#            frontend gates, a native image build and the real-browser
#            onboarding/restore drill, on amd64 AND arm64 runners.
# build    - v* tags only: each architecture's image is built natively on its
#            own runner (no emulation) and pushed by digest, with SBOM and
#            max-mode provenance attestations.
# publish  - joins the two digests into one multi-architecture tag,
#            ghcr.io/mlamoure/purser:<tag> (for example v2026.10.0).
#
# Gate: build and publish run only in mlamoure/purser, on a v* tag, when the
# repository variable PURSER_PUBLICATION_ENABLED is 'true' (Settings -> Secrets
# and variables -> Actions -> Variables). Unset, nothing is published, and a
# manual run from a branch never publishes. The tag must equal "v" + the
# version in pyproject.toml.
#
# Actions are pinned by full commit SHA; the comment names the release.
name: Docker qualification and release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions: {}

env:
  IMAGE: ghcr.io/mlamoure/purser

jobs:
  qualify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Backend gates
        run: |
          uv sync --frozen --group e2e
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy purser/
          uv run pytest tests/ -q
      - name: Frontend tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=moderate
          npm --prefix frontend test
      - name: Build native image and verify architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker build -t purser:qualification .
          test "$(docker image inspect purser:qualification --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - name: Real-browser onboarding and restore drill
        run: |
          uv run --group e2e playwright install --with-deps chromium
          uv run --group e2e python tests/e2e/run_docker.py --image purser:qualification

  build:
    needs: qualify
    if: >-
      github.repository == 'mlamoure/purser' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PURSER_PUBLICATION_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build natively and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Purser
            org.opencontainers.image.description=The finance backend for the personal agent stack
            org.opencontainers.image.source=https://github.com/mlamoure/purser
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "${sources[@]}"
      - name: Verify both architectures
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          test "$platforms" = "linux/amd64,linux/arm64" || { echo "::error::platforms: $platforms"; exit 1; }
